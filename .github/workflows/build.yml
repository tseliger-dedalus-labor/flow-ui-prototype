name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Include frontend in application
        run: |
          mkdir -p backend/application/src/main/resources/static
          cp -R frontend/dist/frontend/browser/. backend/application/src/main/resources/static/

      - name: Test and package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test package

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: flow-ui-prototype
          path: backend/application/target/*.war
          if-no-files-found: error
