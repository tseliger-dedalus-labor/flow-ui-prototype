<section class="node-shell">
  <!-- Host-Slot für die dynamisch instanziierte Fachkomponente. -->
  <ng-container #host />
  @if (hasAccess) {
    @if (node.children.length) {
      <!-- Container-Knoten rendern ihre Kindknoten rekursiv mit demselben Laufzeitkontext. -->
      <div class="children">
        @for (child of node.children; track child) {
          <app-flow-renderer
            [node]="child"
            [context]="context" />
        }
      </div>
    }
  } @else {
    <p class="access-denied">Keine Berechtigung für diese Komponente.</p>
  }
</section>
