@if (showSidebar) {
  <!-- Zweispaltiges Runtime-Layout mit optionaler Navigations- oder Kontext-Sidebar. -->
  <div
    class="flow-layout"
    [class.flow-layout-right]="sidebar?.position === 'RIGHT'"
    [style.--flow-sidebar-width]="sidebarWidth">
    <aside class="flow-sidebar" [attr.aria-label]="sidebar?.ariaLabel || 'Flow-Navigation'">
      <app-flow-renderer [node]="sidebarNode!" [context]="context" />
    </aside>
    <div class="flow-content">
      <app-flow-renderer [node]="node" [context]="context" />
    </div>
  </div>
} @else {
  <!-- Ohne Sidebar wird nur der Hauptknoten direkt gerendert. -->
  <div class="flow-content flow-content-standalone">
    <app-flow-renderer [node]="node" [context]="context" />
  </div>
}
