<section class="reportcenter">
  <h3>Reportcenter</h3>
  <table>
    <thead>
      <tr>
        <th>RecordID</th>
        <th>CaseID</th>
        <th>PatientID</th>
        <th>Patient</th>
        <th>Bezeichnung</th>
        <th>Status</th>
        <th>Datum</th>
      </tr>
    </thead>
    <tbody>
      @for (record of records; track record.RecordID) {
        <tr>
          <td>
            <button type="button" (click)="openRecord(record)">{{ record.RecordID }}</button>
          </td>
          <td>{{ record.CaseID }}</td>
          <td>{{ record.PatientID }}</td>
          <td>{{ record.patientName }}</td>
          <td>{{ record.text }}</td>
          <td>{{ record.status }}</td>
          <td>{{ record.createdAt }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7">Keine Records verfügbar.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
